[package]
name = "material_color_capi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C ABI for the pure Rust Material Design color utilities."
documentation = "https://docs.rs/material_color_capi"
readme = "../../README.md"
keywords = ["material-design", "color", "ffi"]
categories = ["graphics", "external-ffi-bindings"]

[lib]
name = "material_color_capi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
material_color = { path = "../material_color", version = "1.0.0" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
