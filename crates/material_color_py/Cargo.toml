[package]
name = "material_color_py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for the pure Rust Material Design color utilities."
documentation = "https://docs.rs/material_color_py"
readme = "../../README.md"
keywords = ["material-design", "color", "python"]
categories = ["graphics", "api-bindings"]

[lib]
name = "material_color_py"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
material_color = { path = "../material_color", version = "1.0.0" }
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
