name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="$(python tools/release/check_versions.py --tag "${tag}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  crates:
    name: Cargo crates
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cargo package -p material_color --locked
      - run: cargo package -p material_color_capi --locked
      - run: cargo package -p material_color_py --locked
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  wheels:
    name: Python wheels (${{ matrix.label }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --manifest-path crates/material_color_py/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  native-libraries:
    name: Native libraries (${{ matrix.label }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - shell: bash
        run: cargo build -p material_color_capi --release --locked
      - shell: bash
        run: |
          python tools/release/package_cabi.py \
            --version "${{ needs.metadata.outputs.version }}" \
            --target-label "${{ matrix.label }}" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-libraries-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs:
      - metadata
      - crates
      - wheels
      - native-libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: material-color-rs ${{ needs.metadata.outputs.version }}
          body_path: docs/RELEASE.md
          files: dist/*
          fail_on_unmatched_files: true
